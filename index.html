<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>260110_BooleanCube</title>
  </head>
  <body>
    <div id="app">
      <div id="canvas-host"></div>
      <svg id="brush-overlay" aria-hidden="true">
        <circle id="brush-circle" />
        <circle id="falloff-circle" />
        <circle id="brush-dot" />
      </svg>
      <div class="ui-panel" id="panel">
        <div class="panel-header" id="panel-handle"></div>
        <div class="panel-section">
          <label class="label">Face Density <span id="density-value"></span></label>
          <input id="density" type="range" min="16" max="160" step="8" value="64" />
        </div>
        <div class="panel-section">
          <label class="label">Smoothing <span id="smooth-value"></span></label>
          <input id="smoothing" type="range" min="0" max="40" step="1" value="0" />
        </div>
        <div class="panel-section">
          <label class="label">Brush Size <span id="brush-value"></span></label>
          <input id="brush-size" type="range" min="1" max="100" step="1" value="30" />
        </div>
        <div class="panel-section">
          <label class="label">Active Face</label>
          <div class="action-row">
            <button class="action-button active" data-face="bottom">Bottom</button>
            <button class="action-button" data-face="back">Back</button>
            <button class="action-button" data-face="side">Side</button>
          </div>
        </div>
        <div class="panel-section">
          <div class="action-row">
            <button id="rebuild" class="action-button">Rebuild</button>
            <button id="clear-all" class="action-button">Clear</button>
          </div>
        </div>
        <div class="panel-section">
          <div id="mesh-stats" class="mesh-stats-value">Voxels: -- | Faces: --</div>
        </div>
        <div class="panel-header" id="panel-handle-bottom"></div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
